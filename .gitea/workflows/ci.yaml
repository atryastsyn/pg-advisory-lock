name: CI
run-name: ${{ gitea.actor }} is running CI.
on:
  push:
    branches:
      - master

jobs:
  CI:
    runs-on: ubuntu-latest

    services:
      postgres-server:
        image: postgres:18
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 123
        options: >-
          --health-cmd 'pg_isready -U postgres -d testing'
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:123@postgres-server:5432/testing
      POETRY_VERSION: '1.8.3'

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Check package index connectivity
        env:
          HTTP_PROXY: ${{ vars.CI_PROXY }}
          HTTPS_PROXY: ${{ vars.CI_PROXY }}
        run: curl -fsSI --connect-timeout 10 https://pypi.org/simple/

      - name: Install Poetry
        run: python -m pip install "poetry==$POETRY_VERSION"

      - name: Install project dependencies
        env:
          HTTP_PROXY: ${{ vars.CI_PROXY }}
          HTTPS_PROXY: ${{ vars.CI_PROXY }}
        run: poetry install --no-interaction

      - name: Check linting
        run: poetry run ruff check .

      - name: Check formatting
        run: poetry run ruff format --check .

      - name: Check types
        run: poetry run mypy

      - name: Run tests
        run: poetry run pytest

      - name: Build project
        run: poetry build

      - name: Publish package
        run: poetry publish
        env:
          POETRY_PYPI_TOKEN_PYPI: ${{ secrets.PYPI_API_TOKEN }}
