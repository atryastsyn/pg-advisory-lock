services:
  postgres:
    image: postgres:18
    container_name: pg-advisory-lock-postgres18

    ports:
      - "6543:5432"

    environment:
      POSTGRES_DB: testing
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d testing"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
