[tool.poetry]
name = "pg-advisory-lock"
version = "0.0.16"
description = "Pythonic PostgreSQL advisory locking for SQLAlchemy, with structured keys and explicit contention handling."
authors = ["Alexander Tryastsyn"]
license = "MIT"
readme = "README.md"
keywords = ["postgresql", "advisory-lock", "sqlalchemy", "locking", "concurrency"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Database",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
packages = [{ include = "pg_advisory_lock", from = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
sqlalchemy = ">=1.4,<3.0"


[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
ruff = "^0.16.0"
psycopg = "^3.3.4"
mypy = "^2.3.0"
pytest-cov = "^7.1.0"

[tool.ruff]
line-length = 120
include = ["src/**/*.py", "tests/**/*.py"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]

[tool.mypy]
files = ['src']
python_version = '3.12'
strict = true
enable_error_code = ['ignore-without-code']

[tool.pytest.ini_options]
testpaths = ["tests",]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --cov=src --cov-report=term-missing --cov-fail-under=90"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
