[tool.poetry]
name = "pg-advisory-lock"
version = "0.0.5"
description = "Pythonic PostgreSQL advisory locking for SQLAlchemy, with flexible keys and pluggable failure handling."
authors = ["Alexander Tryastsyn"]
readme = "README.md"
packages = [{ include = "pg_advisory_lock", from = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
sqlalchemy = ">=1.4,<3.0"


[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
ruff = "^0.16.0"
psycopg = "^3.3.4"

[tool.ruff]
line-length = 120
include = ["src/**/*.py", "tests/*.py"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]

[tool.pytest.ini_options]
testpaths = ["tests",]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
