
name: CI
run-name: ${{ github.actor }} is running CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres-server:
        image: postgres:18
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d testing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:123@localhost:5432/testing
      POETRY_VERSION: "2.5.1"

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: python -m pip install "poetry==$POETRY_VERSION"

      - name: Install project dependencies
        run: poetry install --no-interaction

      - name: Check linting
        run: poetry run ruff check .

      - name: Check formatting
        run: poetry run ruff format --check .

      - name: Check types
        run: poetry run mypy

      - name: Run tests
        run: poetry run pytest

      - name: Build project
        run: poetry build
